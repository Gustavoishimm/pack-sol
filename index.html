<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connect Wallet</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="card">
    <h1>Connect your wallet</h1>
    <p class="sub">Select a wallet to continue</p>

    <div class="wallets">
      <button class="wallet" data-wallet="phantom">Phantom</button>
      <button class="wallet" data-wallet="backpack">Backpack</button>
      <button class="wallet" data-wallet="solflare">Solflare</button>
    </div>

    <p id="status" class="status"></p>
  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>
